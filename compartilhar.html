<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compartilhar</title>
<style>
*{box-sizing:border-box}
body{
  background:#020b18;
  color:#fff;
  font-family:Arial,sans-serif;
  margin:0;
  padding:20px;
  min-height:100vh;
}
.box{
  max-width:500px;
  margin:auto;
  border:1px solid #38bdf8;
  border-radius:20px;
  padding:20px;
  background:#07172a;
  box-shadow:0 0 25px #000;
}
h1{
  color:#ffd76b;
  text-align:center;
  margin-top:0;
}
p{
  color:#9fb2d8;
  text-align:center;
  font-size:14px;
}
textarea{
  width:100%;
  height:220px;
  border-radius:15px;
  border:2px solid #ffd76b;
  background:#000;
  color:#fff;
  padding:10px;
  font-size:16px;
}
button{
  width:100%;
  margin-top:15px;
  padding:15px;
  border:none;
  border-radius:15px;
  font-size:18px;
  font-weight:bold;
}
.copiar{
  background:#ffd76b;
  color:#000;
}
.voltar{
  background:#374151;
  color:#fff;
}
</style>
</head>
<body>
<div class="box">
<h1>📋 Compartilhar</h1>
<p>Toque em copiar mensagem, abra o WhatsApp e cole.</p>
<textarea id="msg" readonly></textarea>
<button class="copiar" onclick="copiarMensagem()">COPIAR MENSAGEM</button>
<button class="voltar" onclick="voltar()">VOLTAR AO APP</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
let texto = params.get("msg");

if(!texto){
  try{
    texto = sessionStorage.getItem("KODULAR_SHARE_TEXT");
  }catch(e){}
}

texto = texto || "Ranking e Caixa Poker Premium";
document.getElementById("msg").value = texto;

function copiarMensagem(){
  const campo = document.getElementById("msg");
  campo.focus();
  campo.select();
  campo.setSelectionRange(0,99999);

  try{
    document.execCommand("copy");
    alert("Mensagem copiada! Agora abra o WhatsApp e cole.");
  }catch(e){
    alert(texto);
  }
}

function voltar(){
  window.location.href = "index.html";
}
</script>
</body>
</html>
