<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Compartilhar WhatsApp</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#07172a 0%,#02040a 58%,#000 100%);color:#fff;font-family:Arial,Helvetica,sans-serif;padding:18px;display:flex;align-items:center;justify-content:center}
.box{width:min(460px,100%);background:linear-gradient(145deg,#051629,#02070d);border:1px solid #38bdf8;border-radius:22px;padding:18px;box-shadow:0 0 30px #000}
h1{margin:0 0 8px;color:#ffd76b;font-size:23px;text-align:center}
p{color:#9fb2d8;text-align:center;font-size:13px;line-height:1.45}
textarea{width:100%;height:190px;resize:none;border-radius:16px;border:1px solid #38bdf877;background:#070a10;color:#fff;padding:12px;font-size:15px;line-height:1.35}
button{display:block;width:100%;text-align:center;border:0;border-radius:15px;padding:14px;margin-top:10px;font-weight:900;font-size:15px;color:#fff}
.green{background:linear-gradient(135deg,#0b7f3a,#10d26b)}
.blue{background:linear-gradient(135deg,#075985,#38bdf8)}
.gold{background:linear-gradient(135deg,#b8860b,#ffd76b);color:#160d00}
.gray{background:#2b3342}
.small{font-size:12px;color:#9fb2d8;margin-top:12px;text-align:center}
</style>
</head>
<body>
<div class="box">
  <h1>📲 Abrindo WhatsApp</h1>
  <p>Se não abrir automaticamente, toque no botão verde.</p>
  <textarea id="msg" readonly></textarea>
  <button class="green" onclick="abrirWhatsApp()">ABRIR WHATSAPP</button>
  <button class="blue" onclick="compartilharSistema()">COMPARTILHAR PELO CELULAR</button>
  <button class="gold" onclick="copiarTexto()">COPIAR MENSAGEM</button>
  <button class="gray" onclick="voltar()">VOLTAR AO APP</button>
  <div class="small">Compatível com Kodular/WebViewer.</div>
</div>

<script>
function getMensagem(){
  const params = new URLSearchParams(window.location.search);
  let msg = params.get('msg') || '';
  if(!msg){
    try{ msg = sessionStorage.getItem('KODULAR_SHARE_TEXT') || ''; }catch(e){}
  }
  return msg || 'Ranking e Caixa Poker Premium';
}

const texto = getMensagem();
document.getElementById('msg').value = texto;

function abrirWhatsApp(){
  const encoded = encodeURIComponent(texto);

  // No Kodular, HTTPS costuma ser mais estável que whatsapp:// automático.
  window.location.href = 'https://wa.me/?text=' + encoded;
}

function compartilharSistema(){
  if(navigator.share){
    navigator.share({title:'Ranking e Caixa Poker Premium', text:texto}).catch(copiarTexto);
  }else{
    copiarTexto();
  }
}

function copiarTexto(){
  const campo = document.getElementById('msg');
  campo.focus();
  campo.select();
  try{
    document.execCommand('copy');
    alert('Mensagem copiada! Cole no WhatsApp.');
  }catch(e){
    alert(texto);
  }
}

function voltar(){
  window.location.href = 'index.html';
}

window.addEventListener('load', function(){
  setTimeout(abrirWhatsApp, 650);
});
</script>
</body>
</html>
